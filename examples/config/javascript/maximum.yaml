# JavaScript: расширенный пример без привязки к фреймворку.
# Пути, FQN и пороги адаптируйте под проект; слои названы по гексагональной
# схеме, профили для NestJS и React лежат рядом.
config_version: 1
languages:
  enabled: [javascript] # Для смешанного проекта: [javascript, typescript].
  # Расширения js, jsx, mjs и cjs встроены. Пример для старых проектов.
  extensions: {es6: javascript}
paths:
  include: ["**"] # Все поддерживаемые файлы выбранного языка, включая корневые.
  exclude:
    # Тесты, моки и фикстуры: Jest, Vitest, Cypress, Playwright.
    # Globs чувствительны к регистру.
    - "**/__tests__/**"
    - "**/__mocks__/**"
    - "**/*.test.*"
    - "**/*.spec.*"
    - "**/test/**"
    - "**/tests/**"
    - "**/fixtures/**"
    - "e2e/**"
    - "cypress/**"
    - "playwright/**"
    # Сборка, отчёты покрытия и кеш инструментов.
    - "dist/**"
    - "build/**"
    - "out/**"
    - "coverage/**"
    - ".turbo/**"
    # Сгенерированный код и файлы деклараций: в .d.ts нет реализации,
    # но движок считает их сигнатуры функциями.
    - "**/generated/**"
    - "**/__generated__/**"
    - "**/*.generated.*"
    - "**/*.d.ts"
    # Storybook.
    - "**/*.stories.*"
    - "storybook-static/**"
vendor:
  paths: ["node_modules/**", "**/node_modules/**", "vendor/**"]
  mode: collapsed
  parse: lazy # none запрещает раскрытие зависимостей; full разбирает сразу.
limits:
  file_lines: {warn: 400, error: 800}
  function_lines: {warn: 40, error: 100}
  functions_per_file: {warn: 20, error: 40}
  methods_per_class: {warn: 15, error: 30}
  fields_per_class: {warn: 10, error: 20}
  function_params: {warn: 4, error: 7}
  cyclomatic_complexity: {warn: 10, error: 20}
  cognitive_complexity: {warn: 15, error: 30}
  nesting_depth: {warn: 4, error: 6}
  return_points: {warn: 4, error: 8}
  inheritance_depth: {warn: 3, error: 5}
  # Классы, интерфейсы и enum считаются вместе; несколько типов в модуле — норма.
  types_per_file: {warn: 8, error: 16}
  # LCOM4 > 1 означает несколько независимых групп методов. Контроллеры и
  # классы-фасады дают высокие значения по замыслу: см. by_path.
  lcom4: {warn: 2, error: 6}
  fan_in: {warn: 20, error: 40}
  fan_out: {warn: 10, error: 20}
  halstead_volume: {warn: 1000, error: 2000}
  duplicate_functions: {warn: 0, error: 5}
  # Единственный способ сделать цикл импортов между файлами блокирующим в CI:
  # архитектурные находки arch_cycle и arch_boundary код выхода не меняют.
  module_cycle: {error: 0}
  # Все числовые пороги — верхние границы. comment_ratio и
  # maintainability_index не задают минимальную долю/минимальный индекс.
  # by_language нужен только при нескольких языках в languages.enabled,
  # например разные пороги для javascript и typescript в смешанном проекте:
  # для единственного языка он молча перекрывает общий порог выше.
  by_path:
    - glob: "src/presentation/**" # Контроллеры и обработчики: действия независимы по замыслу.
      lcom4: {warn: 10, error: 20}
      function_params: {warn: 6, error: 10}
    - glob: "src/legacy/**" # Замените на каталог существующего долга.
      function_lines: {warn: 80, error: 160}
      cyclomatic_complexity: {warn: 15, error: 30}
  by_entity:
    # Точный FQN из отчёта metrics: путь файла без расширения, затем класс
    # и метод через точку; для функции модуля — путь и имя функции.
    'src/application/worker.Worker.run':
      function_params: {warn: 6, error: 10}
  aggregates:
    "cyclomatic_complexity.p95": {warn: 12, error: 25}
    "function_lines.avg": {warn: 30, error: 60}
# Иллюстративные каталоги слоёв: замените под структуру своего проекта.
sets:
  domain: ["dir:src/domain"]
  application: ["dir:src/application"]
  infrastructure: ["dir:src/infrastructure"]
  presentation: ["dir:src/presentation"]
  core: ["set:domain", "set:application", "!glob:**/generated/**"]
external:
  capture_args: literal
  max_arg_length: 160
  redact: ['(?i)(token|password|secret|api[_-]?key)=[^&\s]+']
  rules:
    # Встроенный каталог знает fetch, http.request, pg, mysql2, amqplib,
    # child_process и net. Цель вызова для правила: <импорт>::<метод>, где
    # импорт — путь пакета и экспорт, например axios.default::post для
    # import axios from 'axios'. Ведущий * покрывает префикс разрешения
    # модуля, а вызов через типизированное свойство класса тоже распознаётся.
    - category: http
      pattern: '*axios.default::post'
      library: axios
      operation: post
    - category: http
      pattern: '*axios.default::put'
      library: axios
      operation: put
metrics:
  count_variadic_parameters: true # ...rest считается одним параметром.
  count_private_methods: true
  count_accessors: true # get/set-аксессоры класса считаются методами.
  count_nested_functions: true # Замыкания и стрелочные функции внутри функций считаются в functions_per_file.
  histogram_bins: 10
graph:
  max_implementations: 50
resolution:
  node_conditions: [node] # Для browser-проекта замените на [browser].
algorithmic_complexity:
  enabled: true
  heuristics: true
  unknown: info # Без статических типов стоимость вызовов часто неизвестна.
  # Линейный проход по массиву в приложении — норма, порог от N^2.
  limits: {warn: "N^2", error: "N^3"}
  by_path:
    - glob: "src/legacy/**"
      limits: {warn: "N^3"}
  by_entity:
    'src/application/worker.Worker.run':
      unknown: warn
architecture:
  enabled: true
  profile: extended # strict — только циклы, явные границы и структурные копии.
  disabled_rules: []
  # Список заменяет default движка целиком; добавлены соглашения экосистемы.
  exclude:
    - "**/__tests__/**"
    - "**/__mocks__/**"
    - "**/*.test.*"
    - "**/*.spec.*"
    - "**/test/**"
    - "**/tests/**"
    - "**/fixtures/**"
    - "**/__fixtures__/**"
    - "e2e/**"
    - "cypress/**"
    - "**/generated/**"
    - "**/__generated__/**"
    - "**/*.generated.*"
    - "**/*.d.ts"
    - "**/*.stories.*"
    - "**/migrations/**"
  rules:
    arch_cycle: {}
    arch_boundary: {}
    arch_dry: {min_tokens: 100, min_statements: 5}
    arch_srp: {min_methods: 8, min_group_methods: 3}
    arch_ocp: {min_sites: 3, min_alternatives: 3}
    arch_factory: {min_sites: 2, min_alternatives: 3}
    arch_lsp: {}
    arch_isp: {min_methods: 8, max_usage_ratio: 0.25}
    arch_demeter: {}
    arch_stability: {instability_delta: 0.3}
  # Слои гексагональной архитектуры: зависимости направлены внутрь, к domain.
  layers:
    - name: domain
      selectors: ["dir:src/domain"]
    - name: application
      selectors: ["dir:src/application"]
    - name: infrastructure
      selectors: ["dir:src/infrastructure"]
    - name: presentation
      selectors: ["dir:src/presentation"]
  forbidden_dependencies:
    - {from: domain, to: application, principle: DIP}
    - {from: domain, to: infrastructure, principle: DIP}
    - {from: domain, to: presentation, principle: DIP}
    - {from: application, to: infrastructure, principle: DIP}
    - {from: application, to: presentation, principle: DIP}
    - {from: infrastructure, to: presentation, principle: DIP}
  # Файлы сборки приложения исключаются из проверки границ, только если их
  # накрывает селектор слоя; вне слоёв зависимость и так не проверяется.
  # Значения для NestJS и React смотрите в их профилях.
  composition_roots: []
  max_evidence: 50
cache:
  enabled: true
  path: .analyzer-cache
output:
  formats: [console] # Для машинного stdout замените на [json].
