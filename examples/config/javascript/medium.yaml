# JavaScript: повседневный анализ без привязки к фреймворку.
# Пороги можно адаптировать под проект.
config_version: 1
languages:
  enabled: [javascript] # Для смешанного проекта: [javascript, typescript].
paths:
  include: ["**"] # Все поддерживаемые файлы выбранного языка, включая корневые.
  exclude:
    # Тесты, моки и фикстуры: Jest, Vitest, Cypress, Playwright.
    # Globs чувствительны к регистру.
    - "**/__tests__/**"
    - "**/__mocks__/**"
    - "**/*.test.*"
    - "**/*.spec.*"
    - "**/test/**"
    - "**/tests/**"
    - "**/fixtures/**"
    - "e2e/**"
    - "cypress/**"
    - "playwright/**"
    # Сборка, отчёты покрытия и кеш инструментов.
    - "dist/**"
    - "build/**"
    - "out/**"
    - "coverage/**"
    - ".turbo/**"
    # Сгенерированный код и файлы деклараций: в .d.ts нет реализации,
    # но движок считает их сигнатуры функциями.
    - "**/generated/**"
    - "**/__generated__/**"
    - "**/*.generated.*"
    - "**/*.d.ts"
    # Storybook.
    - "**/*.stories.*"
    - "storybook-static/**"
    # Каталоги сборки фреймворков смотрите в nestjs.yaml и react.yaml.
vendor:
  # Список заменяет defaults движка; vendor нужен монорепозиториям с PHP-частью.
  paths: ["node_modules/**", "**/node_modules/**", "vendor/**"]
  mode: collapsed
  parse: lazy # none запрещает раскрытие зависимостей; full разбирает сразу.
limits:
  # Первые шесть порогов совпадают с defaults движка и приведены для настройки.
  file_lines: {warn: 400, error: 800}
  function_lines: {warn: 40, error: 100}
  functions_per_file: {warn: 20, error: 40}
  methods_per_class: {warn: 15, error: 30}
  function_params: {warn: 4, error: 7}
  cyclomatic_complexity: {warn: 10, error: 20}
  # Структурные пороги. Модуль здесь — файл: цикл импортов между файлами
  # попадает в отчёт и блокирует CI только с --fail-on-warn.
  nesting_depth: {warn: 4, error: 6}
  cognitive_complexity: {warn: 15, error: 30}
  module_cycle: {warn: 0}
architecture:
  enabled: true
  profile: strict
cache:
  enabled: true
  path: .analyzer-cache
output:
  formats: [console] # Для машинного stdout замените на [json].
